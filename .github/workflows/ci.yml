name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet restore DotFuzz.slnx
          dotnet tool restore

      - name: Check formatting
        run: |
          dotnet csharpier check src
          dotnet csharpier check tests
          dotnet csharpier check benchmarks

      - name: Build
        run: dotnet build DotFuzz.slnx -c Release --no-restore

      - name: Test
        run: dotnet test DotFuzz.slnx -c Release --no-build --no-restore

      - name: NativeAOT smoke
        run: |
          rid=$(dotnet --info | awk '/RID:/ { print $2 }')
          dotnet publish tests/DotFuzz.AotSmoke/DotFuzz.AotSmoke.csproj \
            -c Release -r "$rid" --self-contained
          "tests/DotFuzz.AotSmoke/bin/Release/net10.0/$rid/publish/DotFuzz.AotSmoke"
