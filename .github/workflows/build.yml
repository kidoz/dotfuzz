name: Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: 1

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore packages
        run: dotnet restore DotFuzz.slnx --locked-mode

      # NuGet.Config caches packages under work/.nuget, so a repo-root CSharpier
      # scan would treat restored package files as formatting inputs.
      - name: Check formatting
        run: |
          dotnet csharpier check src
          dotnet csharpier check tests
          dotnet csharpier check benchmarks

      - name: Build
        run: dotnet build DotFuzz.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test DotFuzz.slnx --configuration Release --no-build --no-restore
